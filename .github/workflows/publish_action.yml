name: Publish to Comfy registry
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'Alexankharin' }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          # The SHARP submodule must be materialized so [tool.comfy].includes
          # can pack it into the published archive.
          submodules: recursive
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
