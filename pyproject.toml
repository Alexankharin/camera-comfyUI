[project]
name = "camera-comfyui"
description = "Custom ComfyUI nodes for camera projections (pinhole/fisheye/equirectangular), depth, point clouds, camera trajectories, and 3D/4D Gaussian splatting — including video-to-4D-world workflows."
version = "1.1.0"
license = { file = "LICENSE" }
# Keep in sync with requirements.txt. GitHub/CUDA-flavored extras (vggt,
# gsplat) and the ComfyUI-Flux-Inpainting sibling pack are installed by
# install.py, which ComfyUI-Manager runs automatically after install.
dependencies = [
    "transformers==4.50.0",
    "diffusers==0.33.1",
    "open3d==0.19.0",
    "protobuf",
    "click",
    "timm",
    "plyfile",
    "pillow-heif",
    "matplotlib",
    "imageio",
    "imageio-ffmpeg",
]

[project.urls]
Repository = "https://github.com/Alexankharin/camera-comfyUI"

[tool.comfy]
PublisherId = "alexk"
DisplayName = "camera-comfyUI"
# Force-include the SHARP submodule: its files are a gitlink in the parent repo
# (not git-tracked files), so without this the registry archive would ship
# without submodules/ml-sharpt and ImageToSplat/VideoToFusedSplats would be
# unavailable until users clone it manually.
includes = ["submodules/ml-sharpt/"]
